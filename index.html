<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <title>NES Emulator</title>

  <script src="https://cdn.jsdelivr.net/npm/jsnes@1.2.1/dist/jsnes.js"></script>

  <style>
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      -webkit-touch-callout:none;
      -webkit-user-select:none;
      user-select:none;
    }

    :root{
      --text:#eef3ff;
      --muted:#9ba9ca;
      --border:#3b4c73;
    }

    html,body{
      overscroll-behavior:none;
    }

    body{
      margin:0;
      width:100%;
      height:100vh;
      height:100dvh;
      overflow:hidden;
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
      background:radial-gradient(circle at top,#293965 0%,#11192f 44%,#070b15 100%);
      touch-action:none;
    }

    .app{
      position:relative;
      width:min(100%,760px);
      height:100vh;
      height:100dvh;
      margin:auto;
      padding:12px 14px 20px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex:none;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
      font-size:clamp(14px,3vw,18px);
      font-weight:800;
      letter-spacing:.5px;
    }

    .brand-icon{
      display:grid;
      place-items:center;
      width:clamp(34px,7vw,40px);
      height:clamp(23px,5vw,27px);
      flex:none;
      border:2px solid #fff;
      border-radius:8px;
      background:linear-gradient(145deg,#ff6578,#bc2447);
      box-shadow:0 4px 10px rgba(0,0,0,.3);
      font-size:clamp(10px,2vw,12px);
    }

    .brand-name,
    .status{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .status{
      max-width:52%;
      color:var(--muted);
      font-size:clamp(10px,2vw,12px);
      text-align:right;
    }

    .screen-box{
      position:relative;
      width:100%;
      min-height:0;
      max-height:42vh;
      flex:1 1 auto;
      overflow:hidden;
      border:5px solid #394866;
      border-radius:16px;
      background:#000;
      aspect-ratio:4 / 3;
      box-shadow:
        0 15px 35px rgba(0,0,0,.4),
        inset 0 0 0 2px rgba(255,255,255,.05);
    }

    canvas{
      display:block;
      width:100%;
      height:100%;
      background:#000;
      image-rendering:pixelated;
      image-rendering:crisp-edges;
    }

    .screen-message{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:24px;
      text-align:center;
      background:radial-gradient(circle,rgba(35,49,84,.92),rgba(5,8,16,.97));
    }

    .screen-message strong{
      font-size:clamp(16px,4vw,20px);
    }

    .screen-message span{
      color:#b0bddc;
      font-size:clamp(11px,2.5vw,13px);
      line-height:1.5;
    }

    .top-actions{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      flex:none;
    }

    button{
      min-height:clamp(38px,8vh,46px);
      padding:0 8px;
      border:1px solid var(--border);
      border-radius:12px;
      color:var(--text);
      background:linear-gradient(145deg,#293756,#151d31);
      box-shadow:
        0 4px 0 #080c16,
        0 7px 14px rgba(0,0,0,.2),
        inset 0 1px rgba(255,255,255,.12);
      font:inherit;
      font-size:clamp(11px,2.5vw,14px);
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
      touch-action:manipulation;
    }

    button:active,
    .control.pressed,
    .middle.pressed{
      transform:translateY(3px) scale(.98);
      box-shadow:
        0 1px 0 #080c16,
        inset 0 2px 8px rgba(0,0,0,.42);
      filter:brightness(.88);
    }

    .controls{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      min-height:0;
      flex:1 1 auto;
      padding:4px 2px 0;
    }

    .dpad{
      position:relative;
      width:clamp(135px,29vw,150px);
      height:clamp(135px,29vw,150px);
      flex:none;
      filter:
        drop-shadow(0 10px 12px rgba(0,0,0,.34))
        drop-shadow(0 0 9px rgba(112,155,236,.1));
    }

    .control{
      position:absolute;
      display:grid;
      place-items:center;
      border:2px solid #566783;
      color:#fff;
      background:linear-gradient(145deg,#465875,#202b42);
      box-shadow:
        0 5px 0 #0a0f1d,
        0 8px 14px rgba(0,0,0,.28),
        inset 0 1px rgba(255,255,255,.16);
      font-weight:900;
      cursor:pointer;
      touch-action:none;
    }

    .dpad .control{
      z-index:2;
      width:38%;
      height:38%;
      min-height:0;
      padding:0;
      border:2px solid #6f82a6;
      border-radius:11px;
      background:linear-gradient(145deg,#4e6387 0%,#293954 46%,#18243b 100%);
      box-shadow:
        0 5px 0 #070d19,
        0 9px 15px rgba(0,0,0,.34),
        inset 0 2px 1px rgba(255,255,255,.2),
        inset 0 -3px 5px rgba(0,0,0,.25);
    }

    .dpad .up{
      top:0;
      left:31%;
      border-radius:12px 12px 5px 5px;
    }

    .dpad .down{
      bottom:0;
      left:31%;
      border-radius:5px 5px 12px 12px;
    }

    .dpad .left{
      top:31%;
      left:0;
      border-radius:12px 5px 5px 12px;
    }

    .dpad .right{
      top:31%;
      right:0;
      border-radius:5px 12px 12px 5px;
    }

    .dpad-center{
      position:absolute;
      z-index:3;
      top:31%;
      left:31%;
      width:38%;
      height:38%;
      border:2px solid #627695;
      border-radius:5px;
      pointer-events:none;
      background:radial-gradient(circle at 35% 28%,#526786 0%,#34445f 42%,#1a263c 100%);
      box-shadow:
        inset 0 2px 3px rgba(255,255,255,.13),
        inset 0 -3px 5px rgba(0,0,0,.35);
    }

    .dpad-arrow{
      width:48%;
      height:48%;
      fill:#f5f8ff;
      filter:
        drop-shadow(0 2px 1px rgba(0,0,0,.55))
        drop-shadow(0 0 3px rgba(202,222,255,.35));
    }

    .dpad .control.pressed{
      z-index:4;
      border-color:#a9c7ff;
      background:linear-gradient(145deg,#293b59,#172238);
      box-shadow:
        0 2px 0 #070d19,
        inset 0 3px 8px rgba(0,0,0,.48),
        0 0 12px rgba(112,164,255,.3);
    }

    .dpad .control.pressed .dpad-arrow{
      fill:#bcd9ff;
    }

    .right-controls{
      display:flex;
      align-items:center;
      gap:clamp(10px,2.5vw,14px);
      flex:none;
      padding-right:2px;
    }

    .round{
      position:relative;
      width:clamp(58px,14vw,68px);
      height:clamp(58px,14vw,68px);
      min-height:0;
      padding:0;
      border-radius:50%;
      font-size:clamp(17px,5vw,24px);
      background:linear-gradient(145deg,#ff7180,#bd2548);
      border-color:#ff9eaa;
    }

    .round.b{
      margin-top:clamp(23px,5vw,31px);
      background:linear-gradient(145deg,#6e9bff,#375fd7);
      border-color:#a6bfff;
    }

    .round::after{
      content:attr(data-label);
      position:absolute;
      top:calc(100% + 5px);
      left:50%;
      transform:translateX(-50%);
      color:#c7d2ed;
      font-size:clamp(9px,2.3vw,11px);
      font-weight:800;
    }

    .middle-controls{
      display:flex;
      justify-content:center;
      gap:12px;
      flex:none;
      margin-top:4px;
    }

    .middle{
      position:relative;
      min-width:clamp(70px,20vw,90px);
      min-height:clamp(32px,7vh,38px);
      padding:0 12px;
      border-radius:20px;
      color:#d5def5;
      font-size:clamp(11px,2.5vw,13px);
      touch-action:none;
    }

    .landscape-menu-button{
      display:none;
      position:fixed;
      z-index:20;
      top:max(10px,env(safe-area-inset-top));
      right:max(12px,env(safe-area-inset-right));
      width:38px;
      min-height:38px;
      padding:0;
      border-radius:50%;
      font-size:18px;
    }

    .game-modal{
      position:fixed;
      z-index:100;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(2,5,13,.75);
      backdrop-filter:blur(7px);
    }

    .game-modal.show{
      display:flex;
    }

    .game-modal-card{
      width:min(100%,455px);
      max-height:calc(100dvh - 36px);
      overflow:auto;
      border:1px solid rgba(142,172,240,.42);
      border-radius:19px;
      background:linear-gradient(145deg,#26385f,#111a2e);
      box-shadow:
        0 22px 55px rgba(0,0,0,.58),
        inset 0 1px rgba(255,255,255,.14);
    }

    .game-modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:17px 17px 14px;
      border-bottom:1px solid rgba(153,183,245,.2);
    }

    .game-modal-header strong{
      display:block;
      font-size:16px;
      letter-spacing:.6px;
    }

    .game-modal-header span{
      display:block;
      margin-top:5px;
      color:#aab9d8;
      font-size:11px;
    }

    .close-game-modal{
      display:grid;
      place-items:center;
      width:36px;
      min-height:36px;
      padding:0;
      border-radius:50%;
      font-size:17px;
    }

    .game-list{
      display:flex;
      flex-direction:column;
      gap:10px;
      padding:14px;
    }

    .game-item{
      display:flex;
      align-items:center;
      gap:13px;
      width:100%;
      min-height:70px;
      padding:10px 12px;
      border:1px solid rgba(143,178,248,.3);
      border-radius:13px;
      color:#eff4ff;
      text-align:left;
      background:linear-gradient(145deg,#334b78,#1a2742);
    }

    .local-game{
      background:linear-gradient(145deg,#576183,#2b3450);
    }

    .game-icon,
    .game-cover{
      width:43px;
      height:43px;
      flex:none;
      border-radius:11px;
    }

    .game-icon{
      display:grid;
      place-items:center;
      background:rgba(8,14,29,.42);
      font-size:23px;
    }

    .game-cover{
      object-fit:cover;
      border:1px solid rgba(255,255,255,.18);
      background:#0b1222;
    }

    .game-info{
      min-width:0;
    }

    .game-info strong,
    .game-info small{
      display:block;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .game-info strong{
      font-size:14px;
    }

    .game-info small{
      margin-top:5px;
      color:#b5c4e1;
      font-size:11px;
    }

    .game-ready{
      color:#8ff3b7!important;
    }

    @media(max-height:640px) and (orientation:portrait){
      .app{
        gap:6px;
        padding:8px 10px 12px;
      }

      .screen-box{
        max-height:38vh;
      }

      .dpad{
        width:clamp(122px,27vw,138px);
        height:clamp(122px,27vw,138px);
      }

      .round{
        width:clamp(54px,13vw,62px);
        height:clamp(54px,13vw,62px);
      }

      .round.b{
        margin-top:20px;
      }
    }

    @media (orientation:landscape) and (max-height:600px){
      .app{
        width:100%;
        max-width:none;
        height:100dvh;
        padding:
          max(8px,env(safe-area-inset-top))
          max(14px,env(safe-area-inset-right))
          max(8px,env(safe-area-inset-bottom))
          max(14px,env(safe-area-inset-left));
        display:grid;
        grid-template-columns:minmax(105px,23vw) minmax(210px,4fr) minmax(105px,23vw);
        grid-template-rows:minmax(0,1fr) auto;
        align-items:center;
        column-gap:clamp(10px,3vw,32px);
        row-gap:5px;
      }

      .header,
      .top-actions{
        display:none;
      }

      .landscape-menu-button{
        display:grid;
        place-items:center;
      }

      .screen-box{
        grid-column:2;
        grid-row:1;
        width:100%;
        height:auto;
        min-height:0;
        max-width:min(66vw,calc((100dvh - 65px) * 4 / 3));
        max-height:calc(100dvh - 65px);
        margin:auto;
        align-self:center;
        flex:none;
        border-width:4px;
        border-radius:13px;
      }

      .controls{
        display:contents;
        padding:0;
      }

      .dpad{
        grid-column:1;
        grid-row:1;
        justify-self:center;
        align-self:center;
        width:clamp(105px,20vw,160px);
        height:clamp(105px,20vw,160px);
        transform:translateY(clamp(44px,10vh,62px));
      }

      .right-controls{
        grid-column:3;
        grid-row:1;
        justify-self:center;
        align-self:center;
        gap:clamp(7px,1.8vw,15px);
        padding:0;
        transform:translateY(clamp(44px,10vh,62px));
      }

      .round{
        width:clamp(55px,11vw,82px);
        height:clamp(55px,11vw,82px);
        font-size:clamp(17px,4vw,26px);
      }

      .round.b{
        margin-top:clamp(20px,4vw,34px);
      }

      .round::after{
        top:calc(100% + 3px);
        font-size:10px;
      }

      .middle-controls{
        grid-column:2;
        grid-row:2;
        align-self:start;
        margin:0;
        gap:9px;
        transform:translateY(8px);
      }

      .middle{
        min-width:68px;
        min-height:30px;
        padding:0 11px;
        font-size:10px;
      }
    }

    @media (orientation:landscape) and (max-height:390px){
      .app{
        grid-template-columns:minmax(90px,20vw) minmax(190px,4fr) minmax(90px,20vw);
      }

      .screen-box{
        max-height:calc(100dvh - 50px);
      }

      .dpad{
        width:clamp(92px,18vw,125px);
        height:clamp(92px,18vw,125px);
        transform:translateY(30px);
      }

      .right-controls{
        transform:translateY(30px);
      }

      .round{
        width:clamp(49px,10vw,65px);
        height:clamp(49px,10vw,65px);
      }

      .round.b{
        margin-top:18px;
      }

      .middle{
        min-height:26px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">NES</div>
        <span class="brand-name" id="gameTitle">SUPER MARIO BROS</span>
      </div>

      <div class="status" id="status">Đang chuẩn bị...</div>
    </div>

    <div class="screen-box">
      <canvas id="screen" width="256" height="240"></canvas>

      <div class="screen-message" id="screenMessage">
        <strong>Đang tải Super Mario Bros</strong>
        <span>Vui lòng chờ trong giây lát...</span>
      </div>
    </div>

    <div class="top-actions">
      <button id="pauseButton">Tạm dừng</button>
      <button id="soundButton">Âm thanh: Bật</button>
      <button id="gameButton">Game khác</button>
    </div>

    <div class="controls">
      <div class="dpad">
        <button class="control up" data-key="UP" aria-label="Lên">
          <svg class="dpad-arrow" viewBox="0 0 24 24">
            <path d="M12 4L4.5 12H9v8h6v-8h4.5L12 4z"/>
          </svg>
        </button>

        <button class="control down" data-key="DOWN" aria-label="Xuống">
          <svg class="dpad-arrow" viewBox="0 0 24 24">
            <path d="M12 20l7.5-8H15V4H9v8H4.5l7.5 8z"/>
          </svg>
        </button>

        <button class="control left" data-key="LEFT" aria-label="Trái">
          <svg class="dpad-arrow" viewBox="0 0 24 24">
            <path d="M4 12l8-7.5V9h8v6h-8v4.5L4 12z"/>
          </svg>
        </button>

        <button class="control right" data-key="RIGHT" aria-label="Phải">
          <svg class="dpad-arrow" viewBox="0 0 24 24">
            <path d="M20 12l-8 7.5V15H4V9h8V4.5l8 7.5z"/>
          </svg>
        </button>

        <div class="dpad-center"></div>
      </div>

      <div class="right-controls">
        <button class="control round b" data-key="B" data-label="B">B</button>
        <button class="control round a" data-key="A" data-label="A">A</button>
      </div>
    </div>

    <div class="middle-controls">
      <button class="middle" data-key="SELECT">SELECT</button>
      <button class="middle" data-key="START">START</button>
    </div>
  </div>

  <button
    id="landscapeMenuButton"
    class="landscape-menu-button"
    aria-label="Mở menu game"
  >☰</button>

  <input type="file" id="fileInput" accept=".nes" hidden>

  <div class="game-modal" id="gameModal">
    <div class="game-modal-card">
      <div class="game-modal-header">
        <div>
          <strong>GAME KHÁC</strong>
          <span>Mở ROM từ máy hoặc chọn game có sẵn</span>
        </div>

        <button id="closeGameModal" class="close-game-modal">✕</button>
      </div>

      <div class="game-list">
        <button class="game-item local-game" id="openFileButton">
          <span class="game-icon">📁</span>
          <span class="game-info">
            <strong>Mở file .nes từ máy</strong>
            <small>Chọn ROM NES trong điện thoại hoặc máy tính</small>
          </span>
        </button>

        <button class="game-item" id="adventureButton">
          <img
            class="game-cover"
            src="https://raw.githubusercontent.com/nhut990/files/refs/heads/main/hinh/Adventure%20Island.jpg"
            alt="Adventure Island"
          >
          <span class="game-info">
            <strong>Adventure Island</strong>
            <small id="adventureStatus">Đang tải sẵn game...</small>
          </span>
        </button>

        <button class="game-item" id="contra2Button">
          <img
            class="game-cover"
            src="https://raw.githubusercontent.com/nhut990/files/refs/heads/main/hinh/Contra2.jpg"
            alt="Contra 2"
          >
          <span class="game-info">
            <strong>Contra 2</strong>
            <small id="contra2Status">Đang tải sẵn game...</small>
          </span>
        </button>

        <button class="game-item" id="chessButton">
          <img
            class="game-cover"
            src="https://raw.githubusercontent.com/nhut990/files/refs/heads/main/hinh/Chinese%20Chess.jpg"
            alt="Chinese Chess"
          >
          <span class="game-info">
            <strong>Zhong Guo Xiang Qi</strong>
            <small id="chessStatus">Đang tải sẵn game...</small>
          </span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const GAMES = {
      mario: {
        name: "Super Mario Bros",
        url: "https://raw.githubusercontent.com/nhut990/files/main/hinh/SuperMarioBros.nes"
      },
      adventure: {
        name: "Adventure Island",
        url: "https://raw.githubusercontent.com/nhut990/files/main/music/Adventure%20Island%20(USA).nes"
      },
      contra2: {
        name: "Contra 2",
        url: "https://raw.githubusercontent.com/nhut990/files/main/music/Contra%202.nes"
      },
      chess: {
        name: "Zhong Guo Xiang Qi",
        url: "https://raw.githubusercontent.com/nhut990/files/main/music/Zhong%20Guo%20Xiang%20Qi%20(Chinese%20Chess).nes"
      }
    };

    const NES_SAMPLE_RATE = 44100;
    const NES_FPS = 60.0988;

    /*
      Ring buffer âm thanh.
      Không dùng Array.shift(), vì shift phải dời toàn bộ phần tử mảng,
      rất dễ gây rè/giật trên iPhone.
    */
    const AUDIO_BUFFER_FRAMES = 32768;
    const AUDIO_PREROLL_FRAMES = 4096;

    const audioLeft = new Float32Array(AUDIO_BUFFER_FRAMES);
    const audioRight = new Float32Array(AUDIO_BUFFER_FRAMES);

    let audioReadIndex = 0;
    let audioWriteIndex = 0;
    let audioFrameCount = 0;
    let audioPrimed = false;
    let resampleFraction = 0;

    let audioContext = null;
    let audioNode = null;
    let soundEnabled = true;

    const canvas = document.getElementById("screen");
    const ctx = canvas.getContext("2d", { alpha:false });
    const imageData = ctx.createImageData(256, 240);
    const pixels = imageData.data;

    const status = document.getElementById("status");
    const gameTitle = document.getElementById("gameTitle");
    const screenMessage = document.getElementById("screenMessage");

    const pauseButton = document.getElementById("pauseButton");
    const soundButton = document.getElementById("soundButton");
    const gameButton = document.getElementById("gameButton");
    const landscapeMenuButton = document.getElementById("landscapeMenuButton");

    const gameModal = document.getElementById("gameModal");
    const closeGameModal = document.getElementById("closeGameModal");

    const openFileButton = document.getElementById("openFileButton");
    const fileInput = document.getElementById("fileInput");

    const preloadStatus = {
      adventure: document.getElementById("adventureStatus"),
      contra2: document.getElementById("contra2Status"),
      chess: document.getElementById("chessStatus")
    };

    const keys = {
      UP: jsnes.Controller.BUTTON_UP,
      DOWN: jsnes.Controller.BUTTON_DOWN,
      LEFT: jsnes.Controller.BUTTON_LEFT,
      RIGHT: jsnes.Controller.BUTTON_RIGHT,
      A: jsnes.Controller.BUTTON_A,
      B: jsnes.Controller.BUTTON_B,
      SELECT: jsnes.Controller.BUTTON_SELECT,
      START: jsnes.Controller.BUTTON_START
    };

    let nes = null;
    let gameLoaded = false;
    let paused = false;
    let loadToken = 0;
    let gameClock = 0;
    let frameAccumulator = 0;

    const romCache = {};
    const romPromises = {};

    const activeSources = {};
    Object.keys(keys).forEach(key => {
      activeSources[key] = new Set();
    });

    const pointerOwners = new Map();

    function showMessage(title, text) {
      screenMessage.style.display = "flex";
      screenMessage.innerHTML = "";

      const strong = document.createElement("strong");
      strong.textContent = title;

      const span = document.createElement("span");
      span.textContent = text;

      screenMessage.appendChild(strong);
      screenMessage.appendChild(span);
    }

    function hideMessage() {
      screenMessage.style.display = "none";
    }

    function clearAudioBuffer() {
      audioReadIndex = 0;
      audioWriteIndex = 0;
      audioFrameCount = 0;
      audioPrimed = false;
      resampleFraction = 0;
    }

    function writeAudioFrame(left, right) {
      if (!soundEnabled) return;

      /*
        Khi buffer đầy, bỏ sample mới thay vì làm tràn bộ nhớ.
        Buffer 32768 frame tương đương khoảng 0,74 giây ở 44.1 kHz.
      */
      if (audioFrameCount >= AUDIO_BUFFER_FRAMES) return;

      audioLeft[audioWriteIndex] = left;
      audioRight[audioWriteIndex] = right;

      audioWriteIndex = (audioWriteIndex + 1) % AUDIO_BUFFER_FRAMES;
      audioFrameCount++;
    }

    function peekAudioLeft(offset) {
      return audioLeft[(audioReadIndex + offset) % AUDIO_BUFFER_FRAMES];
    }

    function peekAudioRight(offset) {
      return audioRight[(audioReadIndex + offset) % AUDIO_BUFFER_FRAMES];
    }

    function discardAudioFrames(count) {
      const amount = Math.min(count, audioFrameCount);

      audioReadIndex =
        (audioReadIndex + amount) % AUDIO_BUFFER_FRAMES;

      audioFrameCount -= amount;
    }

    async function ensureAudio() {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        return false;
      }

      let createdNow = false;

      if (!audioContext) {
        audioContext = new AudioContextClass();
        createdNow = true;

        /*
          ScriptProcessorNode là API cũ nhưng vẫn tương thích tốt
          với Safari iPhone. Phần quan trọng là ring buffer +
          resample, để callback không bị quá tải.
        */
        audioNode = audioContext.createScriptProcessor(2048, 0, 2);

        audioNode.onaudioprocess = function(event) {
          const leftOutput = event.outputBuffer.getChannelData(0);
          const rightOutput = event.outputBuffer.getChannelData(1);

          if (
            !soundEnabled ||
            audioContext.state !== "running"
          ) {
            leftOutput.fill(0);
            rightOutput.fill(0);
            return;
          }

          /*
            Chờ sẵn một ít âm thanh trước khi phát.
            Điều này tránh tiếng lạo xạo lúc queue còn quá ít.
          */
          if (!audioPrimed) {
            if (audioFrameCount >= AUDIO_PREROLL_FRAMES) {
              audioPrimed = true;
            } else {
              leftOutput.fill(0);
              rightOutput.fill(0);
              return;
            }
          }

          const outputRate = audioContext.sampleRate;
          const inputPerOutput = NES_SAMPLE_RATE / outputRate;

          for (let i = 0; i < leftOutput.length; i++) {
            /*
              Resample tuyến tính từ audio NES 44.1 kHz
              sang sample rate thật của iPhone/Safari, thường 48 kHz.
            */
            if (audioFrameCount < 2) {
              leftOutput[i] = 0;
              rightOutput[i] = 0;
              audioPrimed = false;
              continue;
            }

            const leftA = peekAudioLeft(0);
            const leftB = peekAudioLeft(1);
            const rightA = peekAudioRight(0);
            const rightB = peekAudioRight(1);

            leftOutput[i] =
              leftA + (leftB - leftA) * resampleFraction;

            rightOutput[i] =
              rightA + (rightB - rightA) * resampleFraction;

            resampleFraction += inputPerOutput;

            const framesToDiscard = Math.floor(resampleFraction);

            if (framesToDiscard > 0) {
              discardAudioFrames(framesToDiscard);
              resampleFraction -= framesToDiscard;
            }
          }
        };

        audioNode.connect(audioContext.destination);
      }

      try {
        if (audioContext.state !== "running") {
          clearAudioBuffer();
          await audioContext.resume();
          clearAudioBuffer();
        } else if (createdNow) {
          clearAudioBuffer();
        }

        return true;
      } catch (error) {
        console.warn("Không thể mở AudioContext:", error);
        return false;
      }
    }

    function validRom(buffer) {
      const bytes = new Uint8Array(buffer);

      return (
        bytes.length >= 16 &&
        bytes[0] === 0x4E &&
        bytes[1] === 0x45 &&
        bytes[2] === 0x53 &&
        bytes[3] === 0x1A
      );
    }

    function toBinary(buffer) {
      const bytes = new Uint8Array(buffer);
      const chunkSize = 8192;
      let result = "";

      for (let i = 0; i < bytes.length; i += chunkSize) {
        result += String.fromCharCode(
          ...bytes.subarray(i, i + chunkSize)
        );
      }

      return result;
    }

    function createNes() {
      clearAudioBuffer();

      nes = new jsnes.NES({
        sampleRate: NES_SAMPLE_RATE,
        preferredFrameRate: NES_FPS,

        onFrame(frame) {
          for (let i = 0, p = 0; i < frame.length; i++, p += 4) {
            const color = frame[i];

            pixels[p] = color & 255;
            pixels[p + 1] = (color >> 8) & 255;
            pixels[p + 2] = (color >> 16) & 255;
            pixels[p + 3] = 255;
          }

          ctx.putImageData(imageData, 0, 0);
        },

        onAudioSample(left, right) {
          writeAudioFrame(left, right);
        }
      });
    }

    function updateKeyVisual(key) {
      const pressed =
        activeSources[key] &&
        activeSources[key].size > 0;

      document
        .querySelectorAll(`[data-key="${key}"]`)
        .forEach(button => {
          button.classList.toggle("pressed", pressed);
        });
    }

    function setVirtualKey(key, sourceId, isDown) {
      if (!(key in keys)) return;

      const sources = activeSources[key];
      const wasPressed = sources.size > 0;

      if (isDown) {
        sources.add(sourceId);
      } else {
        sources.delete(sourceId);
      }

      const isPressed = sources.size > 0;

      if (!wasPressed && isPressed) {
        if (gameLoaded && nes) {
          ensureAudio();
          nes.buttonDown(1, keys[key]);
        }
      }

      if (wasPressed && !isPressed) {
        if (nes) {
          nes.buttonUp(1, keys[key]);
        }
      }

      updateKeyVisual(key);
    }

    function releaseAll() {
      pointerOwners.clear();

      Object.keys(activeSources).forEach(key => {
        activeSources[key].clear();

        if (nes) {
          nes.buttonUp(1, keys[key]);
        }

        updateKeyVisual(key);
      });

      document.querySelectorAll("[data-key]").forEach(button => {
        if (button._pointers) {
          button._pointers.clear();
        }

        button.classList.remove("pressed");
      });
    }

    async function downloadRom(url) {
      const response = await fetch(url, {
        cache: "force-cache"
      });

      if (!response.ok) {
        throw new Error("Không thể tải ROM. HTTP " + response.status);
      }

      const buffer = await response.arrayBuffer();

      if (!validRom(buffer)) {
        throw new Error("Link không trả về ROM NES hợp lệ.");
      }

      return buffer;
    }

    async function preloadGame(id) {
      if (romCache[id]) return romCache[id];
      if (romPromises[id]) return romPromises[id];

      const game = GAMES[id];
      const statusElement = preloadStatus[id];

      if (statusElement) {
        statusElement.textContent = "Đang tải sẵn game...";
        statusElement.classList.remove("game-ready");
      }

      romPromises[id] = downloadRom(game.url)
        .then(buffer => {
          romCache[id] = buffer;

          if (statusElement) {
            statusElement.textContent = "Đã sẵn sàng";
            statusElement.classList.add("game-ready");
          }

          return buffer;
        })
        .catch(error => {
          romPromises[id] = null;

          if (statusElement) {
            statusElement.textContent =
              "Chưa tải được — chạm để thử lại";
            statusElement.classList.remove("game-ready");
          }

          throw error;
        });

      return romPromises[id];
    }

    function loadBuffer(buffer, name) {
      if (!validRom(buffer)) {
        throw new Error("ROM NES không hợp lệ.");
      }

      releaseAll();
      clearAudioBuffer();

      gameLoaded = false;
      paused = false;

      createNes();
      nes.loadROM(toBinary(buffer));

      gameLoaded = true;
      paused = false;
      frameAccumulator = 0;
      gameClock = performance.now();

      pauseButton.textContent = "Tạm dừng";
      gameTitle.textContent = name.toUpperCase();
      status.textContent = "Đang chơi: " + name;

      hideMessage();
    }

    async function loadGame(id) {
      const currentToken = ++loadToken;
      const game = GAMES[id];

      try {
        releaseAll();
        clearAudioBuffer();

        gameLoaded = false;
        paused = false;

        gameTitle.textContent = game.name.toUpperCase();
        status.textContent = "Đang tải " + game.name + "...";

        showMessage(
          "Đang tải " + game.name,
          "Vui lòng chờ trong giây lát..."
        );

        const buffer =
          romCache[id] || await preloadGame(id);

        if (currentToken !== loadToken) return;

        loadBuffer(buffer, game.name);
      } catch (error) {
        if (currentToken !== loadToken) return;

        console.error(error);

        gameLoaded = false;
        clearAudioBuffer();

        status.textContent = "Không thể tải game";

        showMessage(
          "Không thể tải game",
          error.message || "Hãy kiểm tra mạng rồi thử lại."
        );
      }
    }

    function loadLocalRom(file) {
      const currentToken = ++loadToken;
      const name = file.name.replace(/\.nes$/i, "");
      const reader = new FileReader();

      releaseAll();
      clearAudioBuffer();

      gameLoaded = false;
      paused = false;

      gameTitle.textContent = name.toUpperCase();
      status.textContent = "Đang đọc ROM từ máy...";

      showMessage(
        "Đang mở game",
        "Đang đọc ROM từ thiết bị..."
      );

      reader.onload = function() {
        if (currentToken !== loadToken) return;

        try {
          loadBuffer(reader.result, name);
        } catch (error) {
          status.textContent = "Không thể mở file";

          showMessage(
            "Không thể mở game",
            error.message || "File ROM này không hợp lệ."
          );
        }
      };

      reader.onerror = function() {
        if (currentToken !== loadToken) return;

        status.textContent = "Không thể đọc file";

        showMessage(
          "Không thể đọc file",
          "Hãy thử lại bằng một file .nes khác."
        );
      };

      reader.readAsArrayBuffer(file);
    }

    /*
      Không chạy 1 frame NES cho mỗi requestAnimationFrame.
      Bộ điều tiết này giữ game ở gần 60.0988 FPS,
      tránh lệ thuộc tần số màn hình hoặc bị chạy sai tốc độ.
    */
    function gameLoop(now) {
      if (!gameClock) gameClock = now;

      const elapsed = Math.min(now - gameClock, 100);
      gameClock = now;

      if (gameLoaded && !paused && nes) {
        frameAccumulator += elapsed;

        const frameDuration = 1000 / NES_FPS;
        let framesThisCycle = 0;

        while (
          frameAccumulator >= frameDuration &&
          framesThisCycle < 4
        ) {
          nes.frame();
          frameAccumulator -= frameDuration;
          framesThisCycle++;
        }

        /*
          Nếu máy bị lag lâu, bỏ phần thời gian quá cũ
          để game không cố chạy bù vô hạn.
        */
        if (framesThisCycle === 4) {
          frameAccumulator = 0;
        }
      }

      requestAnimationFrame(gameLoop);
    }

    function releasePointer(pointerId) {
      const button = pointerOwners.get(pointerId);

      if (!button) return;

      const key = button.dataset.key;

      pointerOwners.delete(pointerId);

      if (button._pointers) {
        button._pointers.delete(pointerId);
      }

      setVirtualKey(key, "pointer:" + pointerId, false);
    }

    document.querySelectorAll("[data-key]").forEach(button => {
      const key = button.dataset.key;
      button._pointers = new Set();

      button.addEventListener("pointerdown", function(event) {
        event.preventDefault();

        const pointerId = event.pointerId;

        if (pointerOwners.has(pointerId)) {
          releasePointer(pointerId);
        }

        pointerOwners.set(pointerId, button);
        button._pointers.add(pointerId);

        try {
          button.setPointerCapture(pointerId);
        } catch (error) {}

        setVirtualKey(key, "pointer:" + pointerId, true);
      });

      button.addEventListener("pointerup", function(event) {
        event.preventDefault();
        releasePointer(event.pointerId);
      });

      button.addEventListener("pointercancel", function(event) {
        event.preventDefault();
        releasePointer(event.pointerId);
      });

      button.addEventListener("lostpointercapture", function(event) {
        releasePointer(event.pointerId);
      });

      button.addEventListener("contextmenu", function(event) {
        event.preventDefault();
      });
    });

    document.addEventListener("pointerup", function(event) {
      releasePointer(event.pointerId);
    }, true);

    document.addEventListener("pointercancel", function(event) {
      releasePointer(event.pointerId);
    }, true);

    const keyboardMap = {
      ArrowUp: "UP",
      ArrowDown: "DOWN",
      ArrowLeft: "LEFT",
      ArrowRight: "RIGHT",
      z: "A",
      Z: "A",
      x: "B",
      X: "B",
      Enter: "START",
      Shift: "SELECT"
    };

    window.addEventListener("keydown", function(event) {
      const key = keyboardMap[event.key];

      if (!key || event.repeat) return;

      event.preventDefault();
      setVirtualKey(key, "keyboard:" + event.code, true);
    });

    window.addEventListener("keyup", function(event) {
      const key = keyboardMap[event.key];

      if (!key) return;

      event.preventDefault();
      setVirtualKey(key, "keyboard:" + event.code, false);
    });

    pauseButton.addEventListener("click", function() {
      if (!gameLoaded) return;

      paused = !paused;
      clearAudioBuffer();
      releaseAll();

      pauseButton.textContent =
        paused ? "Tiếp tục" : "Tạm dừng";

      status.textContent =
        paused ? "Game đang tạm dừng" : "Đang chơi";

      gameClock = performance.now();
      frameAccumulator = 0;
    });

    soundButton.addEventListener("click", async function() {
      soundEnabled = !soundEnabled;
      clearAudioBuffer();

      soundButton.textContent =
        "Âm thanh: " + (soundEnabled ? "Bật" : "Tắt");

      if (soundEnabled) {
        await ensureAudio();
      }
    });

    function openMenu() {
      releaseAll();
      gameModal.classList.add("show");
    }

    gameButton.addEventListener("click", openMenu);
    landscapeMenuButton.addEventListener("click", openMenu);

    closeGameModal.addEventListener("click", function() {
      gameModal.classList.remove("show");
    });

    gameModal.addEventListener("click", function(event) {
      if (event.target === gameModal) {
        gameModal.classList.remove("show");
      }
    });

    openFileButton.addEventListener("click", function() {
      gameModal.classList.remove("show");
      fileInput.click();
    });

    document.getElementById("adventureButton").addEventListener("click", function() {
      gameModal.classList.remove("show");
      loadGame("adventure");
    });

    document.getElementById("contra2Button").addEventListener("click", function() {
      gameModal.classList.remove("show");
      loadGame("contra2");
    });

    document.getElementById("chessButton").addEventListener("click", function() {
      gameModal.classList.remove("show");
      loadGame("chess");
    });

    fileInput.addEventListener("change", function(event) {
      const file = event.target.files[0];

      if (!file) return;

      loadLocalRom(file);
      fileInput.value = "";
    });

    window.addEventListener("blur", function() {
      releaseAll();
      clearAudioBuffer();
    });

    window.addEventListener("pagehide", function() {
      releaseAll();
      clearAudioBuffer();
    });

    window.addEventListener("orientationchange", function() {
      releaseAll();
      clearAudioBuffer();
    });

    document.addEventListener("visibilitychange", function() {
      if (!document.hidden) return;

      releaseAll();
      clearAudioBuffer();

      if (gameLoaded && !paused) {
        paused = true;
        pauseButton.textContent = "Tiếp tục";
        status.textContent = "Game đang tạm dừng";
      }
    });

    if (typeof jsnes === "undefined") {
      status.textContent = "Không tải được thư viện jsnes";

      showMessage(
        "Lỗi thư viện",
        "Không thể tải jsnes. Hãy kiểm tra mạng rồi tải lại trang."
      );
    } else {
      requestAnimationFrame(gameLoop);

      loadGame("mario");

      preloadGame("adventure").catch(() => {});
      preloadGame("contra2").catch(() => {});
      preloadGame("chess").catch(() => {});
    }
  </script>
</body>
</html>
